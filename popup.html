<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Talent Protocol API Key</title>
    <style>
      body {
        width: 300px;
        padding: 15px;
      }
      .input-group {
        margin-bottom: 15px;
      }
      input {
        width: 100%;
        padding: 5px;
        margin-top: 5px;
      }
      #saved-message {
        display: none;
        margin-top: 10px;
        color: #2ecc71;
      }
    </style>
  </head>
  <body>
    <div class="input-group">
      <label for="api-key">Talent Protocol API Key:</label>
      <input 
        type="password" 
        id="api-key" 
        placeholder="Enter your API key"
        aria-label="Enter your Talent Protocol API key"
      >
    </div>
    <button 
      id="save-api-key"
      aria-label="Save API key"
    >Save</button>
    <div 
      id="saved-message" 
      role="status" 
      aria-live="polite"
    >API key saved!</div>
    <script src="popup.js"></script>
  </body>
</html>
